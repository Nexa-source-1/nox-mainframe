<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b1020;
      color: #f4f6ff;
    }

    main {
      width: min(100%, 420px);
      padding: 32px;
      border: 1px solid #29314c;
      border-radius: 16px;
      background: #121a2e;
      box-shadow: 0 18px 60px #0006;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    .intro {
      margin: 0 0 24px;
      color: #aeb8d0;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #394564;
      border-radius: 9px;
      background: #0b1020;
      color: #f4f6ff;
      font: inherit;
    }

    input:focus {
      outline: 2px solid #8b9eff;
      outline-offset: 2px;
    }

    #ghostKeyInput {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.04em;
    }

    #usernameAvailability {
      min-height: 1.4em;
      margin: 8px 0 0;
      color: #aeb8d0;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      background: #7188ff;
      color: #0b1020;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #loginMessage {
      min-height: 1.5em;
      margin: 14px 0 0;
      color: #ffaaaa;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main>
    <h1>Log in</h1>
    <p class="intro">Enter your username and saved 64-character key.</p>

    <form id="login-form" novalidate>
      <label for="usernameInput">Username</label>
      <input
        id="usernameInput"
        name="username"
        type="text"
        minlength="3"
        maxlength="24"
        autocomplete="username"
        autocapitalize="off"
        required
      >
      <p id="usernameAvailability" role="status" aria-live="polite"></p>

      <label for="ghostKeyInput">Saved key</label>
      <input
        id="ghostKeyInput"
        name="ghostKey"
        type="password"
        autocomplete="current-password"
        autocapitalize="off"
        spellcheck="false"
        required
      >

      <button id="btn-login" type="submit">Log in</button>
      <p id="loginMessage" role="alert" aria-live="polite"></p>
    </form>
  </main>

  <script type="module">
    // Assumes supabase.js contains: export const supabase = createClient(...)
    import { supabase } from './supabase.js';

    const loginForm = document.getElementById('login-form');
    const usernameInput = document.getElementById('usernameInput');
    const ghostKeyInput = document.getElementById('ghostKeyInput');
    const loginButton = document.getElementById('btn-login');
    const loginMessage = document.getElementById('loginMessage');
    const usernameAvailability =
      document.getElementById('usernameAvailability');

    const USERNAME_EMAIL_DOMAIN = 'nexa.citadel';
    const USERNAME_PATTERN = /^[a-z0-9_]{3,24}$/;

    let availabilityTimer;
    let availabilityRequestId = 0;

    function isInvalidLogin(error) {
      return error?.code === 'invalid_credentials' ||
        error?.message === 'Invalid login credentials';
    }

    function redirectToDashboard() {
      // Supabase Auth persists the session. Do not cache the key yourself.
      window.location.assign('/Dashboard.html');
    }

    function scheduleUsernameAvailabilityCheck() {
      clearTimeout(availabilityTimer);

      // Ignore results from older requests if the user has typed again.
      const requestId = ++availabilityRequestId;
      const username = usernameInput.value.trim().toLowerCase();

      usernameAvailability.style.color = '#aeb8d0';

      if (!username) {
        usernameAvailability.textContent = '';
        return;
      }

      if (username.length < 3) {
        usernameAvailability.textContent =
          'Enter at least 3 characters to check availability.';
        return;
      }

      if (!USERNAME_PATTERN.test(username)) {
        usernameAvailability.textContent =
          'Use 3–24 lowercase letters, numbers, or underscores.';
        return;
      }

      usernameAvailability.textContent = '🌍Checking availability…';

      availabilityTimer = setTimeout(async () => {
        try {
          const { data, error } = await supabase.rpc(
            'nox_login_username_available',
            { p_username: username }
          );

          if (requestId !== availabilityRequestId) return;
          if (error) throw error;
          if (typeof data !== 'boolean') {
            throw new Error('Availability check returned an unexpected response.');
          }

          if (data) {
            usernameAvailability.style.color = '#9ee6ae';
            usernameAvailability.textContent =
              'Username is available for a new account.';
          } else {
            usernameAvailability.style.color = '#ffd27f';
            usernameAvailability.textContent =
              'Username is already registered. Enter your saved key to log in.';
          }
        } catch (error) {
          if (requestId !== availabilityRequestId) return;

          console.error('Username availability check failed:', error);
          usernameAvailability.style.color = '#ffaaaa';
          usernameAvailability.textContent =
            'Could not check availability right now. You can still try to log in.';
        }
      }, 350);
    }

    usernameInput.addEventListener(
      'input',
      scheduleUsernameAvailabilityCheck
    );

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      loginMessage.textContent = '';
      loginMessage.style.color = '#ffaaaa';

      const username = usernameInput.value.trim().toLowerCase();
      const ghostKey = ghostKeyInput.value.trim();
      const anonymousEmail = `${username}@${USERNAME_EMAIL_DOMAIN}`;

      if (!USERNAME_PATTERN.test(username)) {
        loginMessage.textContent =
          'Username must be 3–24 characters: lowercase letters, numbers, or underscores.';
        return;
      }

      if (ghostKey.length !== 64) {
        loginMessage.textContent =
          `The key must be exactly 64 characters; this input has ${ghostKey.length}.`;
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = 'Working…';
      loginMessage.textContent = 'Signing in…';

      try {
        const { data: loginData, error: loginError } =
          await supabase.auth.signInWithPassword({
            email: anonymousEmail,
            password: ghostKey
          });

        if (!loginError && loginData.session) {
          redirectToDashboard();
          return;
        }

        // Supabase Auth returns errors in { error }; they are not normally thrown.
        if (!isInvalidLogin(loginError)) {
          throw loginError || new Error('Sign-in returned no session.');
        }

        // JIT signup fallback. The database trigger creates the account row.
        const { data: signUpData, error: signUpError } =
          await supabase.auth.signUp({
            email: anonymousEmail,
            password: ghostKey,
            options: {
              data: {
                display_username: username
              }
            }
          });

        if (signUpError) {
          throw signUpError;
        }

        if (!signUpData.user) {
          throw new Error('Signup returned no user.');
        }

        if (!signUpData.session) {
          loginMessage.textContent =
            'Signup was accepted, but no session was issued. Check your email-confirmation settings.';
          return;
        }

        redirectToDashboard();
      } catch (error) {
        console.error('Login or signup failed:', error);
        loginMessage.textContent =
          error?.message || 'Login or account provisioning failed.';
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
